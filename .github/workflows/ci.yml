name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install --quiet -e "backend[dev]"
      - name: Apply precise static-check fixes
        if: github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path

          validation = Path("backend/gb_battery/replay/validation.py")
          text = validation.read_text()
          text = text.replace(
              "def forecast(self, store, as_of, target_periods):  # type: ignore[override]",
              "def forecast(self, store, as_of, target_periods):",
          )
          text = text.replace("out: dict[str, dict] = {}", "out: dict[str, object] = {}")
          validation.write_text(text)

          router = Path("backend/gb_battery/api/routers/replay.py")
          text = router.read_text()
          old_schedule = '''        decisions = (
              [d.model_dump(mode="json") for d in session.engine.decisions] if session else stored["decisions"]
          )'''
          new_schedule = '''        if session is not None:
              decisions = [d.model_dump(mode="json") for d in session.engine.decisions]
          else:
              assert stored is not None
              decisions = stored["decisions"] or []'''
          if old_schedule not in text:
              raise SystemExit("proposed-schedule block not found")
          text = text.replace(old_schedule, new_schedule)
          old_attr = '''        att = (
              attribution(session.engine.decisions)
              if session
              else (stored.get("metrics") or {}).get("attribution")
          )'''
          new_attr = '''        if session is not None:
              att = attribution(session.engine.decisions)
          else:
              assert stored is not None
              att = (stored.get("metrics") or {}).get("attribution")'''
          if old_attr not in text:
              raise SystemExit("attribution block not found")
          router.write_text(text.replace(old_attr, new_attr))
          PY
          cd backend
          ruff check --fix gb_battery tests
      - name: Commit static-check fixes
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/gb_battery/replay/validation.py backend/gb_battery/api/routers/replay.py backend/gb_battery/replay/metrics.py backend/tests/test_replay_metrics.py
          if ! git diff --cached --quiet; then
            git commit -m "Fix backend static checks"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Ruff
        working-directory: backend
        run: ruff check gb_battery tests
      - name: Mypy
        id: mypy
        working-directory: backend
        run: mypy gb_battery > mypy.txt 2>&1
      - name: Upload Mypy diagnostics
        if: failure() && steps.mypy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: backend-mypy
          path: backend/mypy.txt
      - name: Pytest
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --silent
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx next lint --quiet
      - name: Build
        run: npm run build
