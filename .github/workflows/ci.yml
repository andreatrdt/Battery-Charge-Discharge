name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install --quiet -e "backend[dev]"
      - name: Ruff
        id: ruff
        working-directory: backend
        run: ruff check --fix gb_battery tests > ruff.txt 2>&1
      - name: Upload Ruff-corrected sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ruff-corrected
          path: |
            backend/gb_battery/replay/metrics.py
            backend/tests/test_replay_metrics.py
            backend/ruff.txt
      - name: Mypy
        id: mypy
        working-directory: backend
        run: mypy gb_battery > mypy.txt 2>&1
      - name: Upload Mypy diagnostics
        if: failure() && steps.mypy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: backend-mypy
          path: backend/mypy.txt
      - name: Pytest
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --silent
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        id: lint
        run: npx next lint --quiet > lint.txt 2>&1
      - name: Upload lint diagnostics
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lint
          path: frontend/lint.txt
      - name: Build
        run: npm run build
